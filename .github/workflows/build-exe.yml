name: Build Windows EXE

# Автоматическая сборка portable EXE при каждом обновлении main.
# Готовый файл публикуется в Releases:
#   https://github.com/HellShaftSam/AVC-AnimeVoiceCommand/releases/latest
# Ручной запуск: вкладка Actions → Build Windows EXE → Run workflow.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'worklog.md'
      - 'upload/**'
      - 'tool-results/**'
      - 'download/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --- Next.js UI (standalone-сервер внутри EXE) ---

      - name: Install UI dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create runtime SQLite database
        env:
          # Относительно prisma/schema.prisma → <root>/db/custom.db
          DATABASE_URL: 'file:../db/custom.db'
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Build Next.js (standalone)
        env:
          DATABASE_URL: 'file:../db/custom.db'
        run: npm run build

      # --- Electron-оболочка → portable EXE ---

      - name: Install Electron shell dependencies
        working-directory: electron-app
        run: npm install --no-audit --no-fund

      # --- Локальный AI-слой: проверка внешних ассетов ДО сборки (§61–§64, §117) ---

      - name: Validate AI asset URLs (STT/TTS/LLM)
        run: node scripts/validate-ai-assets.mjs

      # --- Чистый Node-рантайм для изолированного AI-воркера (§112, §130) ---

      - name: Download bundled Node runtime
        shell: pwsh
        run: |
          $v = '22.11.0'
          $url = "https://nodejs.org/dist/v$v/node-v$v-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath node-tmp
          New-Item -ItemType Directory -Force -Path electron-app/runtime-node | Out-Null
          Copy-Item "node-tmp/node-v$v-win-x64/node.exe" electron-app/runtime-node/node.exe
          node.exe --version 2>$null; electron-app/runtime-node/node.exe --version

      # --- Бандленный Python-рантайм STT (faster-whisper, верифиц. Mantella, v1.0.22) ---

      - name: Assemble bundled Python runtime (faster-whisper)
        shell: pwsh
        run: |
          $v = '3.11.9'
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$v/python-$v-embed-amd64.zip" -OutFile py-embed.zip
          Expand-Archive -Path py-embed.zip -DestinationPath electron-app/python-runtime
          # включаем import site (иначе pip недоступен в embeddable-сборке)
          $pth = "electron-app/python-runtime/python311._pth"
          (Get-Content $pth) -replace '#import site', 'import site' | Set-Content $pth
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          & electron-app/python-runtime/python.exe get-pip.py --no-warn-script-location --quiet
          & electron-app/python-runtime/python.exe -m pip install --no-warn-script-location --quiet -r electron-app/ai/stt-python/requirements.txt
          & electron-app/python-runtime/python.exe -c "import faster_whisper, onnxruntime, numpy; print('python-runtime OK: fw', faster_whisper.__version__, '| ort', onnxruntime.__version__, '| np', numpy.__version__)"

      # --- Сборка AI-пака (воркер + нативные модули реальными файлами, §113) ---

      - name: Assemble AI pack
        run: node scripts/assemble-ai-pack.mjs

      - name: Build portable EXE
        working-directory: electron-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "Building AVC-Anime portable v$VERSION"
          npx electron-builder --win portable --config electron-builder.json \
            --config.extraMetadata.version="$VERSION" --publish never
          ls -la dist

      # --- Страж упаковки (урок v1.0.20): main.cjs пакуется в app.asar, а папка ai/ ---
      # --- живёт рядом в resources/ai (extraResources). «Голый» require('./ai/...') ---
      # --- из asar-файла крашит EXE при старте. Проверяем реальную раскладку сборки ---
      - name: Verify packaged AI layer layout
        run: node scripts/check-packaged-layout.mjs

      # --- STT selftest на РЕАЛЬНОМ Windows с бандленным python (до публикации!) ---

      - name: STT service selftest (Windows, bundled runtime)
        env:
          AVC_PYTHON: ${{ github.workspace }}/electron-app/dist/win-unpacked/resources/python-runtime/python.exe
        run: node scripts/ci-stt-selftest.mjs

      # --- Контрольные суммы релиза: EXE-обновлятор сверяет SHA-256 перед установкой ---

      - name: Generate SHA256SUMS.txt
        working-directory: electron-app/dist
        shell: pwsh
        run: |
          $lines = Get-ChildItem -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVC-Anime-Portable-1.0.${{ github.run_number }}
          path: |
            electron-app/dist/*.exe
            electron-app/dist/SHA256SUMS.txt
          if-no-files-found: error

      # --- Публикация в Releases (всегда доступно по /releases/latest) ---

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AVC-Anime EXE — build #${{ github.run_number }}
          body: |
            **Portable Windows EXE (x64)** — автоматическая сборка из коммита ${{ github.sha }}.

            **Файл:** `AVC-Anime-Portable-1.0.${{ github.run_number }}.exe` (см. Assets ниже)
            **Целостность:** `SHA256SUMS.txt` — встроенный обновлятор сверяет SHA-256 перед установкой

            - Не требует установки: один EXE, данные — в профиле пользователя
            - Встроенный Next.js UI (свой локальный сервер, интернет нужен для сайта)
            - Постоянная сессия YummyAnime: вход один раз — на реальном сайте
            - Библиотека аккаунта (Смотрю/В Планах/Просмотрено/…) читается с сайта
            - Голосовые команды (микрофон), история, алиасы — локально в SQLite
            - Пароли и cookie никогда не покидают профиль сайта

            Постоянная ссылка на последнюю сборку:
            https://github.com/HellShaftSam/AVC-AnimeVoiceCommand/releases/latest
          files: |
            electron-app/dist/*.exe
            electron-app/dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
